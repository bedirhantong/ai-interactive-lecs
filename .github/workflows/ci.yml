# Runs on every push and pull request. All jobs run in parallel.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner image pinned so an "ubuntu-latest" switch cannot break CI unannounced; bump deliberately.
env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  api:
    name: API · lint, tests (SQLite + PostgreSQL), migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atolye
          POSTGRES_PASSWORD: atolye
          POSTGRES_DB: atolye_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atolye -d atolye_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL (schema built by the migrations)
        run: pytest -q
        env:
          ATOLYE_TEST_DATABASE_URL: postgresql+psycopg://atolye:atolye@localhost:5432/atolye_test
      - name: Migrations match the models
        run: |
          alembic upgrade head
          alembic check
        env:
          ATOLYE_DATABASE_URL: postgresql+psycopg://atolye:atolye@localhost:5432/atolye_test

  web:
    name: Web · lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v6  # unit tests run generated Python with CPython
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Web · end-to-end (Chrome, real Pyodide, real API + PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atolye
          POSTGRES_PASSWORD: atolye
          POSTGRES_DB: atolye
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atolye -d atolye"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ATOLYE_DATABASE_URL: postgresql+psycopg://atolye:atolye@localhost:5432/atolye
      ATOLYE_DEMO_MODE: "true"
      ATOLYE_ALLOWED_ORIGINS: http://localhost:3100
      E2E_REQUIRE_API: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start the API
        working-directory: apps/api
        run: |
          pip install -e .
          alembic upgrade head
          uvicorn app.main:app --port 8000 > ../../uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/api/v1/health/ready && break; sleep 1; done
      - working-directory: apps/web
        run: npm ci
      - name: Playwright system dependencies (uses the preinstalled Google Chrome)
        working-directory: apps/web
        run: npx playwright install-deps chromium
      - working-directory: apps/web
        run: npx playwright test
      - if: failure()
        run: cat uvicorn.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  api-contract:
    name: API · Postman collection against a running API
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atolye
          POSTGRES_PASSWORD: atolye
          POSTGRES_DB: atolye
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atolye -d atolye"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ATOLYE_DATABASE_URL: postgresql+psycopg://atolye:atolye@localhost:5432/atolye
      ATOLYE_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - working-directory: apps/api
        run: |
          pip install -e .
          alembic upgrade head
          uvicorn app.main:app --port 8000 > ../../uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/api/v1/health/ready && break; sleep 1; done
      - name: Collection is up to date with its generator
        run: |
          python3 scripts/build_postman_collection.py
          git diff --exit-code docs/postman/
      - run: npx --yes newman@6 run docs/postman/ai-atolye.postman_collection.json
      - if: failure()
        run: cat uvicorn.log

  colab-notebook:
    name: Colab Lab · template builds and runs end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # close to Google Colab's runtime
      - run: pip install numpy pandas scikit-learn matplotlib nbformat nbclient ipykernel
      - name: Notebook is up to date with its builder
        run: |
          python3 scripts/build_colab_notebooks.py
          git diff --exit-code content/colab/
      - name: Execute the notebook and validate its exported report
        run: python scripts/verify_colab_notebook.py

  production-images:
    name: Production · build images, start the stack, smoke test over HTTPS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Throwaway secrets for this run
        run: |
          cat > ci.env <<ENV
          SITE_ADDRESS=localhost
          ATOLYE_ALLOWED_ORIGINS=https://localhost:8443
          HTTP_PORT=8080
          HTTPS_PORT=8443
          POSTGRES_PASSWORD=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
          ATOLYE_SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
          IMAGE_TAG=ci-${{ github.sha }}
          ENV
      - name: Build and start (db → migrate → api, maintenance, web → proxy)
        run: docker compose -f deploy/compose.prod.yml --env-file ci.env up -d --build --wait
      - run: scripts/prod_smoke_test.sh ci.env https://localhost:8443
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.prod.yml --env-file ci.env logs --tail 200
      - if: always()
        run: docker compose -f deploy/compose.prod.yml --env-file ci.env down -v
