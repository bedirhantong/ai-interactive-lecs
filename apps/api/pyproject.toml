[project]
name = "ai-atolye-api"
version = "0.1.0"
description = "AI Atölye API: accounts, progress, notebook snapshots, training reports, classrooms. Runs no student code."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, imports, bugbear, pyupgrade, simplify, security (bandit), datetime, logging
select = ["E", "F", "I", "B", "UP", "SIM", "S", "DTZ", "LOG", "G"]
ignore = [
  "B008",  # FastAPI dependencies are declared with Depends()/Query() defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "E741", "B023"]  # asserts, fixture passwords, short names in tests
"migrations/*" = ["E501"]
