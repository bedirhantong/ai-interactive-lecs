# Local PostgreSQL for the API. The web app and API run directly on the host
# (see README). No GPU, no Jupyter, no per-student containers.
#
#   docker compose up -d db      start
#   docker compose down          stop (data is kept in the "pgdata" volume)
#   docker compose down -v       stop and DELETE all local data
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atolye
      POSTGRES_PASSWORD: atolye   # local development only
      POSTGRES_DB: atolye
    ports:
      # Host port 5433 by default, so it never clashes with a locally installed
      # PostgreSQL on 5432. Reachable only from this machine.
      - "127.0.0.1:${ATOLYE_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atolye -d atolye"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
